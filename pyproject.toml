[project]
name = "fraud-detection-processor"
version = "0.3.1"
description = "Real-time worker: minimises each payment, builds the card features, calls the inference API and stores the result"
readme = "README.md"
authors = [
    { name = "mygithub", email = "mymail" }
]
requires-python = ">=3.12"
dependencies = [
    "fraud-detection-contracts",
    "fraud-detection-database",
    "fraud-detection-features",
    "httpx>=0.28.1",
    "mlflow>=3.17.0",
    "pandas>=3.0.6",
    "psycopg2-binary>=2.9.13",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.3",
]

[project.scripts]
fraud-detection-processor = "fraud_detection_processor:main"
fraud-detection-replay = "fraud_detection_processor.replay:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
fraud-detection-contracts = { path = "./fraud-detection-contracts", editable = true }
fraud-detection-features = { path = "../fraud-detection-features", editable = true }
fraud-detection-database = { path = "../fraud-detection-database" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = [
    "integration: calls the real services configured in secrets.env",
]
# Default run: unit tests only. Integration tests: uv run pytest -m integration
addopts = "-m 'not integration'"
